<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Yeseva+One&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css"
        integrity="sha512-ApSLB1Pd3/bZN8fWB/RG9YhN/7bd9Hkf3AGaE2mPfebjrxagjuBtx2GcgdqIlJkUzwylBo61r9Xa9NmgBI0swA=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <title>SAJNI NOVELTY</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <div class="navbar">
            <div class="logo"></div>
            <span class="name" style="font-family: 'Yeseva one';">Sajani novelty </span>
            <input class="search-input" placeholder="search anything...">
            <Button class="location">
                <i class="fa-solid fa-location-dot" class="loc"></i>
                Cheak location
            </Button>
            <div class="shop">
                <i class="fa-solid fa-cart-shopping"></i>
                sign in
            </div>
        </div>
        <div class="bar">
            <a href="" class="bar-feature" style="font-family: yeseva-one;">Featured Products <i
                    class="fa-solid fa-wand-magic-sparkles"></i></a>
            <select class="bar-select" style="font-family: yeseva-one;">
                <option>Categories</option>
            </select>
            <a href="" class="bar-feature" style="font-family: yeseva-one;">All Products</a>
        </div>
    </header>
    <main>
        <div class="hero"></div>
        <div class="pro">
            <div class="product">
                <div style="font-family: yeseva-one;">Featured Products</div>
                <p>Check out our newest addition to the store!</p>
            </div>
            <div class="right">
                <a href="#">View All</a>
            </div>
        </div>
    </main>
</body>

</html>
